<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Elorriaga.org</title>
  <script>
    fetch('config.json?t=' + Date.now())
      .then(response => response.json())
      .then(config => {
        window.location.replace(config.url);
      })
      .catch(error => {
        document.body.innerHTML = '<p>Error al cargar el destino.</p>';
      });
  </script>
</head>
<body>
  <p>Redireccionando...</p>
</body>
</html>
